<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="stylesheet.css">
    <!-- <script src="script.js" defer></script> -->
    <script src="new_script.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="all">

            <div class="score" id="sc">
                <p class="score-para" id="sc-para">....</p>
            </div>

            <div class="com-choice" id="c1">
                <p class="com-para" id="c1-para">....</p>
            </div>

            <div class="player-choice" id="p1">
                <p class="player-para" id="p1-para">....</p>
            </div>

            <div class="button-container">
                <button type="button" id="rock">Rock</button>
                <button type="button" id="paper">Paper</button>
                <button type="button" id="scissors">Scissors</button>
                
            </div>

            <div class="game-controls" id="gc">
                <input type="number" value="3">
                <button type="button" id="start">Start/Reset</button>
                <button type="button" id="ghost">Start/Reset</button>
            </div>
            
        </div>
    </div>
</body>
</html>
